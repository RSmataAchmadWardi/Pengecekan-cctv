<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a33">
<title>Keamanan Security RS Mata Achmad Wardi – Pengecekan CCTV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f5fa;--surface:#fff;--surface2:#f6f8fc;--ink:#0d1b33;--muted:#62728a;--line:#e0e6f0;
  --accent:#2457e6;--accent2:#5b8cff;--accent-ink:#fff;--hero1:#0b1a33;--hero2:#16336b;
  --ok:#0b9a62;--ok-bg:#dff5ea;--warn:#c26a00;--warn-bg:#fdecd2;--bad:#d1322b;--bad-bg:#fde1df;--idle:#62728a;--idle-bg:#e8edf4;
  --shadow:0 1px 2px rgba(13,27,51,.06),0 8px 24px -12px rgba(13,27,51,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08101e;--surface:#101b2f;--surface2:#0c1627;--ink:#e8eefb;--muted:#8da0bd;--line:#1e2e49;
  --accent:#6f9bff;--accent2:#9bb9ff;--accent-ink:#071226;--hero1:#0f2247;--hero2:#1b3d82;
  --ok:#4fd49b;--ok-bg:#0f3123;--warn:#f2b05a;--warn-bg:#382710;--bad:#ff8b83;--bad-bg:#40201e;--idle:#8da0bd;--idle-bg:#1a2840;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#08101e;--surface:#101b2f;--surface2:#0c1627;--ink:#e8eefb;--muted:#8da0bd;--line:#1e2e49;
  --accent:#6f9bff;--accent2:#9bb9ff;--accent-ink:#071226;--hero1:#0f2247;--hero2:#1b3d82;
  --ok:#4fd49b;--ok-bg:#0f3123;--warn:#f2b05a;--warn-bg:#382710;--bad:#ff8b83;--bad-bg:#40201e;--idle:#8da0bd;--idle-bg:#1a2840;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Sora",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:21}
.bar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--hero2),var(--hero1));display:grid;place-items:center;flex:none;color:#fff;box-shadow:var(--shadow)}
.brand h1{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;min-height:42px;transition:transform .12s,border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:transparent;background:var(--bad-bg)}
.btn.small{padding:7px 11px;min-height:38px;font-size:14px;border-radius:10px}
.btn.icon{width:42px;padding:0}

.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 110px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,var(--hero2),var(--hero1) 60%);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);pointer-events:none}
.hero>*{position:relative}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:#ff5a52;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.hero h2{font-size:clamp(22px,4.4vw,32px);font-weight:700;margin:12px 0 4px;line-height:1.15}
.hero p{margin:0;color:rgba(255,255,255,.72);font-size:14px;max-width:46ch}
.hl{min-width:0}
.ring{width:168px;height:168px;position:relative}
.ring svg{transform:rotate(-90deg);animation:spin .9s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{transform:rotate(-200deg) scale(.82);opacity:0}}
.ring circle{fill:none;stroke-width:13}
.ring .tr{stroke:rgba(255,255,255,.1)}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:800 40px/1 "Sora",sans-serif}
.ring b small{display:block;font:500 12px "Plus Jakarta Sans",sans-serif;opacity:.7;margin-top:5px}
.stack{display:flex;height:12px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.12);margin:18px 0 14px;gap:2px}
.stack i{display:block;height:100%;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1)}
.leg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.leg button{all:unset;box-sizing:border-box;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;transition:background .15s,transform .12s}
.leg button:hover{background:rgba(255,255,255,.16)}
.leg button:active{transform:scale(.97)}
.leg button:focus-visible{outline:3px solid #fff}
.leg .t{display:flex;align-items:center;gap:7px;font-size:12px;color:rgba(255,255,255,.78);font-weight:600}
.leg .t i{width:9px;height:9px;border-radius:50%;flex:none}
.leg .n{display:flex;align-items:baseline;gap:6px;font:800 24px/1.1 "Sora",sans-serif;margin-top:4px}
.leg .n small{font:600 12px "Plus Jakarta Sans",sans-serif;color:rgba(255,255,255,.6)}

/* Filter chips */
.stats{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 4px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px 8px 10px;cursor:pointer;font-weight:600;font-size:14px;transition:all .15s}
.stat b{min-width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:13px;padding:0 7px;background:var(--idle-bg);color:var(--idle)}
.stat.ok b{background:var(--ok-bg);color:var(--ok)}.stat.warn b{background:var(--warn-bg);color:var(--warn)}.stat.bad b{background:var(--bad-bg);color:var(--bad)}.stat.all b{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.stat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat[aria-pressed="true"] b{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}

.search{position:relative;margin:12px 0 16px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-height:46px}

/* Camera cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cam{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.cam:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.feed{height:118px;position:relative;color:#cfe0f5;overflow:hidden;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(160deg,#17314f,#0a1626 70%)}
.feed::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.feed::after{content:"";position:absolute;inset:10px;border-radius:10px;border:1px solid rgba(255,255,255,.14);pointer-events:none;mask:linear-gradient(#000,#000) top left/16px 16px no-repeat,linear-gradient(#000,#000) top right/16px 16px no-repeat,linear-gradient(#000,#000) bottom left/16px 16px no-repeat,linear-gradient(#000,#000) bottom right/16px 16px no-repeat;-webkit-mask:linear-gradient(#000,#000) top left/16px 16px no-repeat,linear-gradient(#000,#000) top right/16px 16px no-repeat,linear-gradient(#000,#000) bottom left/16px 16px no-repeat,linear-gradient(#000,#000) bottom right/16px 16px no-repeat}
.feed>*{position:relative;z-index:1}
.feed .id{font:600 12px "Plus Jakarta Sans",monospace;display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.4);padding:3px 9px;border-radius:7px;color:#fff;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .id i{width:7px;height:7px;border-radius:50%;background:#7a8aa0;flex:none}
.cam.s-ok .feed .id i{background:#ff5a52;animation:blink 1.6s infinite}
.feed .sig{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:600 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.04em;color:#8da0bd}
.cam.s-bad .feed{background:linear-gradient(160deg,#3a1614,#150808 70%)}
.cam.s-bad .feed .sig{color:#ff9d96}
.cam.s-warn .feed{background:linear-gradient(160deg,#3a2a12,#141008 70%)}
.led{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.led::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok .led,.led.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn .led,.led.s-warn{background:var(--warn-bg);color:var(--warn)}.s-bad .led,.led.s-bad{background:var(--bad-bg);color:var(--bad)}.s-idle .led,.led.s-idle{background:var(--idle-bg);color:var(--idle)}
.body{padding:14px 16px;flex:1}
.body h3{font-size:17px;font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:6px;align-items:flex-start}
.meta .ic{width:14px;height:14px;margin-top:3px}
.dots{display:flex;gap:4px;margin:12px 0 2px}
.dots i{flex:1;height:6px;border-radius:4px;background:var(--idle-bg)}
.dots i.g{background:var(--ok)}.dots i.r{background:var(--bad)}
.note{margin-top:10px;font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.note.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad);font-weight:500}
.late{margin-top:10px;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:10px}
.acts{display:flex;gap:8px;padding:12px 16px 16px}
.acts .primary{flex:1}

.empty{grid-column:1/-1;text-align:center;padding:52px 16px;background:var(--surface);border:1.5px dashed var(--line);border-radius:20px}
.empty .ic{width:40px;height:40px;margin:0 auto 12px;color:var(--muted)}
.empty h2{font-size:19px;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px}
.skel{height:300px;border-radius:20px;background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%) 0/300% 100%;border:1px solid var(--line);animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-300% 0}}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 12px 28px -8px rgba(36,87,230,.55);border-radius:18px;min-height:54px;padding:0 20px}

/* Dialogs */
dialog{border:0;border-radius:24px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100% - 24px));max-height:92vh;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog[open]{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:rgba(6,12,24,.62);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}}
.dh{padding:20px 22px 8px}
.dh h2{font-size:21px;font-weight:700}
.db{padding:6px 22px 14px;overflow:auto;max-height:62vh}
.df{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.df .primary{flex:1;min-width:140px}
label.f{display:block;margin:12px 0 5px;font-weight:600;font-size:13px;color:var(--muted)}
.in{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);min-height:44px;transition:border-color .15s}
.in:focus{outline:none;border-color:var(--accent)}
.prog{height:8px;background:var(--idle-bg);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;width:100%;background:var(--ok);border-radius:9px;transition:width .25s,background .25s}
.prog-t{font-size:13px;font-weight:600}

/* Toggle row */
.chk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer;min-height:54px;transition:background .2s,border-color .2s;user-select:none}
.chk:has(input:checked){background:var(--ok-bg);border-color:transparent}
.chk:has(input:not(:checked)){background:var(--bad-bg);border-color:transparent}
.chk span{flex:1;font-weight:600}
.chk em{font-style:normal;font-size:12px;font-weight:700;min-width:48px;text-align:right}
.chk:has(input:checked) em{color:var(--ok)}.chk:has(input:not(:checked)) em{color:var(--bad)}
.chk input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:30px;background:var(--bad);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0;order:3}
.chk input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.chk input:checked{background:var(--ok)}
.chk input:checked::after{transform:translateX(20px)}

.hist{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:14px 0;position:relative}
.hist::before{content:"";position:absolute;left:-7px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.hist.x::before{background:var(--bad)}
.hist .fails{color:var(--bad);font-size:13px;font-weight:500}
.hist .okt{color:var(--ok);font-size:13px;font-weight:500}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.storage{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;display:flex;gap:7px;align-items:center;justify-content:center}
.storage::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.storage.err::before{background:var(--bad)}

@media (max-width:600px){
  .hero{grid-template-columns:1fr;padding:20px}
  .ring{width:150px;height:150px;grid-row:1;margin:0 auto}
  .ring b{font-size:34px}
  .leg{grid-template-columns:repeat(2,1fr)}
  .brand h1{font-size:14px}
  dialog{margin:auto auto 0;width:100%;max-width:none;border-radius:24px 24px 0 0}
  dialog[open]{animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes sheet{from{transform:translateY(100%)}}
  .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M3 8l12-3v9L3 11z"/><path d="M15 8l6-2v8l-6-2"/><path d="M7 14v5M5 19h5"/></svg></div>
    <div><h1>Security RS Mata Achmad Wardi</h1><small id="subtitle">Pengecekan CCTV</small></div>
  </div>
  <div class="row">
    <button class="btn icon" id="theme" type="button" aria-label="Ganti tema terang atau gelap"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    <button class="btn primary hide-m" id="add" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tambah kamera</button>
  </div>
</div></header>

<div class="wrap">
  <section class="hero" aria-label="Ringkasan kondisi">
    <div class="hl">
      <span class="live"><i></i><span id="clock">--:--</span></span>
      <h2 id="heroT">Memuat data kamera…</h2>
      <p id="heroP">Menghubungkan ke server.</p>
      <div class="stack" id="stack" aria-hidden="true"></div>
      <div class="leg" id="leg"></div>
    </div>
    <div class="ring" role="img" aria-label="Diagram status seluruh kamera">
      <svg viewBox="0 0 128 128"><circle class="tr" cx="64" cy="64" r="52"/><g id="dn"></g></svg>
      <b><span id="pct">0</span><small>kamera</small></b>
    </div>
  </section>

  <nav class="stats" id="stats" aria-label="Filter status"></nav>
  <div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="Cari nama atau lokasi kamera" aria-label="Cari kamera"></div>
  <main class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
  <p class="storage" id="storage">Menghubungkan…</p>
</div>

<button class="btn primary fab" id="fab" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="hide-d">Tambah kamera</span></button>

<dialog id="dForm"><form method="dialog" id="fForm">
  <div class="dh"><h2 id="fTitle">Tambah kamera</h2></div>
  <div class="db">
    <label class="f" for="fWho">Nama petugas</label><input class="in" id="fWho" required maxlength="50" placeholder="Contoh: Budi Santoso">
    <label class="f" for="fName">Nama kamera</label><input class="in" id="fName" required maxlength="60" placeholder="Contoh: CAM-01 Lobi">
    <label class="f" for="fLoc">Lokasi</label><input class="in" id="fLoc" required maxlength="80" placeholder="Contoh: Pintu masuk utama">
    <label class="f" for="fTime">Jam</label><input class="in" id="fTime" type="time" required>
    <label class="f" for="fDesc">Keterangan</label><textarea class="in" id="fDesc" rows="3" maxlength="300" placeholder="Contoh: terpasang di atas pintu, menghadap parkiran"></textarea>
  </div>
  <div class="df"><button class="btn danger" id="fDel" type="button" hidden>Hapus kamera</button><button class="btn" value="cancel" formnovalidate>Batal</button><button class="btn primary" value="ok">Simpan</button></div>
</form></dialog>

<dialog id="dCheck"><form method="dialog" id="fCheck">
  <div class="dh"><h2 id="cTitle">Cek kamera</h2><div class="sub" id="cSub"></div>
    <div class="prog"><i id="cBar"></i></div><div class="prog-t" id="cCount"></div></div>
  <div class="db">
    <div id="cList"></div>
    <label class="f" for="cWho">Nama petugas</label><input class="in" id="cWho" required maxlength="50">
    <label class="f" for="cTime">Jam pengecekan</label><input class="in" id="cTime" type="time" required>
    <label class="f" for="cNote">Keterangan (opsional)</label><textarea class="in" id="cNote" rows="3" maxlength="300" placeholder="Misalnya: lensa berdebu, perlu dibersihkan"></textarea>
  </div>
  <div class="df"><button class="btn" value="cancel" formnovalidate>Batal</button><button class="btn primary" value="ok">Simpan pengecekan</button></div>
</form></dialog>

<dialog id="dHist"><form method="dialog">
  <div class="dh"><h2 id="hTitle">Riwayat</h2><div class="sub" id="hSub"></div></div>
  <div class="db" id="hList"></div>
  <div class="df"><button class="btn primary" value="ok">Tutup</button></div>
</form></dialog>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDZgQpmR4dhfxuTYw4N749Cf4PJ1UcSqoE",
  authDomain: "planning-with-ai-bcb63.firebaseapp.com",
  databaseURL: "https://planning-with-ai-bcb63-default-rtdb.firebaseio.com",
  projectId: "planning-with-ai-bcb63",
  storageBucket: "planning-with-ai-bcb63.firebasestorage.app",
  messagingSenderId: "852009949932",
  appId: "1:852009949932:web:4a4b626ceee3f2e0c623c9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const DATA_REF = ref(db, 'ronda-cctv');

var STALE_DAYS=7;
var CHECKS=[
  {k:"power",t:"Kamera menyala"},
  {k:"image",t:"Gambar jelas"},
  {k:"view",t:"Sudut pandang sesuai"},
  {k:"lens",t:"Lensa dan casing bersih"},
  {k:"rec",t:"Rekaman tersimpan"},
  {k:"night",t:"Mode malam berfungsi"},
  {k:"cable",t:"Kabel dan dudukan aman"}
];
var S={cams:[],who:""}, filter="all", editId=null, checkId=null, loaded=false;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hm(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function atTime(v){var d=new Date(),p=(v||"").split(":");if(p.length===2)d.setHours(+p[0],+p[1],0,0);return d.getTime()}
function fmt(t){return new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},2400)}

function status(c){
  var h=c.history&&c.history[0];
  if(!h)return "idle";
  if(!h.checks||!h.checks.power)return "bad";
  for(var i=0;i<CHECKS.length;i++)if(!h.checks[CHECKS[i].k])return "warn";
  return "ok";
}
var LABEL={ok:"Normal",warn:"Perlu perhatian",bad:"Mati",idle:"Belum dicek"};
var SIG={ok:"SINYAL BAIK",warn:"SINYAL TERGANGGU",bad:"NO SIGNAL",idle:"MENUNGGU PENGECEKAN"};
function stale(c){var h=c.history&&c.history[0];return h&&(Date.now()-h.at)>STALE_DAYS*864e5}
function fails(h){if(!h.checks)return [];return CHECKS.filter(function(x){return !h.checks[x.k]}).map(function(x){return x.t})}
var PIN='<svg class="ic" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
var USR='<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';

function clock(){
  $("clock").textContent=new Date().toLocaleString("id-ID",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
}
clock();setInterval(clock,20000);

function render(){
  var counts={all:S.cams.length,ok:0,warn:0,bad:0,idle:0};
  S.cams.forEach(function(c){counts[status(c)]++});

  // Hero: diagram donat + bar bertumpuk + legenda semua status
  var n=counts.all,C=326.7;
  var META=[["ok","Normal","#4fd49b"],["warn","Perhatian","#f2b05a"],["bad","Mati","#ff8b83"],["idle","Belum dicek","#9fb0c8"]];
  $("pct").textContent=n;
  var used=META.filter(function(m){return counts[m[0]]>0}).length,gap=used>1?3:0,off=0,arcs="";
  META.forEach(function(m){
    var v=counts[m[0]];if(!v)return;
    var len=Math.max(v/n*C-gap,1);
    arcs+='<circle cx="64" cy="64" r="52" stroke="'+m[2]+'" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>';
    off+=v/n*C;
  });
  $("dn").innerHTML=arcs;
  $("stack").innerHTML=META.map(function(m){return '<i style="flex:'+counts[m[0]]+' 1 0;background:'+m[2]+'"></i>'}).join("");
  $("leg").innerHTML=META.map(function(m){
    var v=counts[m[0]],p=n?Math.round(v/n*100):0;
    return '<button type="button" data-f="'+m[0]+'" aria-label="Tampilkan kamera '+m[1]+': '+v+'"><span class="t"><i style="background:'+m[2]+'"></i>'+m[1]+'</span><span class="n">'+v+'<small>'+p+'%</small></span></button>';
  }).join("");
  if(!loaded){}else if(!n){$("heroT").textContent="Belum ada kamera";$("heroP").textContent="Tambahkan kamera pertama untuk mulai ronda.";}
  else{
    var pct=Math.round(counts.ok/n*100);
    $("heroT").textContent=counts.ok===n?"Semua kamera normal":"Kondisi "+n+" kamera hari ini";
    var parts=[];
    if(counts.bad)parts.push(counts.bad+" mati");
    if(counts.warn)parts.push(counts.warn+" perlu perhatian");
    if(counts.idle)parts.push(counts.idle+" belum dicek");
    $("heroP").textContent=counts.ok===n?"Seluruh kamera aktif dan merekam dengan baik.":pct+"% kamera normal. Perlu tindak lanjut: "+parts.join(", ")+".";
  }

  var defs=[["all","Semua"],["ok","Normal"],["warn","Perhatian"],["bad","Mati"],["idle","Belum dicek"]];
  $("stats").innerHTML=defs.map(function(d){
    return '<button type="button" class="stat '+d[0]+'" data-f="'+d[0]+'" aria-pressed="'+(filter===d[0])+'"><b>'+counts[d[0]]+'</b>'+d[1]+'</button>'}).join("");
  var q=$("q").value.trim().toLowerCase();
  var list=S.cams.filter(function(c){
    return (filter==="all"||status(c)===filter)&&(!q||(c.name+" "+c.loc).toLowerCase().indexOf(q)>-1)});
  if(!loaded){return}
  if(!S.cams.length){
    $("grid").innerHTML='<div class="empty"><svg class="ic" viewBox="0 0 24 24"><path d="M3 8l12-3v9L3 11z"/><path d="M15 8l6-2v8l-6-2"/></svg><h2>Belum ada kamera</h2><p class="sub">Tekan Tambah kamera untuk mulai pengecekan.</p></div>';
  }else if(!list.length){
    $("grid").innerHTML='<div class="empty"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><h2>Tidak ada hasil</h2><p class="sub">Ubah kata pencarian atau pilih filter lain.</p></div>';
  }else{
    $("grid").innerHTML=list.map(function(c){
      var s=status(c),h=c.history&&c.history[0],f=h?fails(h):[];
      var dots=CHECKS.map(function(x){return '<i class="'+(h&&h.checks?(h.checks[x.k]?'g':'r'):'')+'" title="'+esc(x.t)+'"></i>'}).join("");
      return '<article class="cam s-'+s+'"><div class="feed"><span class="id"><i></i>'+esc(c.name)+'</span><span class="led">'+LABEL[s]+'</span><span class="sig">'+SIG[s]+'</span></div>'+
        '<div class="body"><h3>'+esc(c.name)+'</h3><div class="meta">'+PIN+'<span>'+esc(c.loc)+'</span></div>'+
        (c.petugas?'<div class="meta">'+USR+'<span>'+esc(c.petugas)+(c.time?' · jam '+esc(c.time):'')+'</span></div>':'')+
        '<div class="dots" aria-hidden="true">'+dots+'</div>'+
        (c.desc?'<div class="note">'+esc(c.desc)+'</div>':'')+
        (h?'<div class="meta" style="margin-top:8px">Dicek '+fmt(h.at)+' oleh '+esc(h.who)+'</div>':'<div class="meta" style="margin-top:8px">Belum pernah dicek</div>')+
        (f.length?'<div class="note bad">Bermasalah: '+esc(f.join(", "))+'</div>':'')+
        (h&&h.note?'<div class="note">'+esc(h.note)+'</div>':'')+
        (stale(c)?'<div class="late">Sudah lebih dari '+STALE_DAYS+' hari, saatnya dicek lagi</div>':'')+
        '</div><div class="acts"><button class="btn primary small" type="button" data-act="check" data-id="'+c.id+'">Mulai cek</button>'+
        '<button class="btn small" type="button" data-act="hist" data-id="'+c.id+'">Riwayat ('+((c.history&&c.history.length)||0)+')</button>'+
        '<button class="btn small" type="button" data-act="edit" data-id="'+c.id+'" aria-label="Ubah kamera">Ubah</button></div></article>';
    }).join("");
  }
}
function find(id){return S.cams.filter(function(c){return c.id===id})[0]}

function openForm(id){
  editId=id||null;var c=id?find(id):null;
  $("fTitle").textContent=c?"Ubah kamera":"Tambah kamera";
  $("fWho").value=c?(c.petugas||""):(S.who||"");$("fName").value=c?c.name:"";$("fLoc").value=c?c.loc:"";$("fTime").value=c?(c.time||hm()):hm();$("fDesc").value=c?(c.desc||""):"";
  $("fDel").hidden=!c;$("dForm").showModal();$("fWho").focus();
}
function updCount(){
  var all=document.querySelectorAll("#cList input"),ok=0;
  all.forEach(function(i){if(i.checked)ok++;i.closest(".chk").querySelector("em").textContent=i.checked?"Baik":"Masalah"});
  var p=ok/all.length;
  $("cBar").style.width=(p*100)+"%";$("cBar").style.background=p===1?"var(--ok)":(all[0].checked?"var(--warn)":"var(--bad)");
  $("cCount").textContent=ok+" dari "+all.length+" kondisi baik";
}
function openCheck(id){
  checkId=id;var c=find(id);
  $("cTitle").textContent=c.name;$("cSub").textContent=c.loc+" · geser ke kiri jika mati atau rusak";
  $("cList").innerHTML=CHECKS.map(function(x){
    return '<label class="chk"><input type="checkbox" data-k="'+x.k+'" checked><span>'+x.t+'</span><em>Baik</em></label>'}).join("");
  $("cWho").value=c.petugas||S.who||"";$("cTime").value=hm();$("cNote").value="";
  updCount();$("dCheck").showModal();
}
function openHist(id){
  var c=find(id);$("hTitle").textContent=c.name;$("hSub").textContent=c.loc;
  var hist=c.history||[];
  $("hList").innerHTML=hist.length?hist.map(function(h){
    var f=fails(h);
    return '<div class="hist'+(f.length?' x':'')+'"><b>'+fmt(h.at)+'</b> · '+esc(h.who)+'<br>'+
      (f.length?'<span class="fails">Bermasalah: '+esc(f.join(", "))+'</span>':'<span class="okt">Semua pemeriksaan baik</span>')+
      (h.note?'<div class="sub">'+esc(h.note)+'</div>':'')+'</div>'}).join(""):'<p class="sub">Belum ada riwayat pengecekan.</p>';
  $("dHist").showModal();
}

async function saveToCloud(){
  try{
    await set(DATA_REF, S);
    return true;
  }catch(e){
    console.error("Gagal simpan:", e);
    toast("Gagal simpan ke cloud: "+e.message);
    return false;
  }
}

onValue(DATA_REF, function(snapshot){
  var data = snapshot.val();
  if(data && Array.isArray(data.cams)){
    S = {cams:data.cams, who:data.who||""};
  }else{
    S = {cams:[], who:""};
  }
  loaded=true;
  render();
  $("storage").className="storage";
  $("storage").textContent="Tersinkronisasi real-time. Data aman di cloud.";
}, function(error){
  console.error("Listener error:", error);
  $("storage").className="storage err";
  $("storage").textContent = "Gagal terhubung ke Firebase: "+error.message;
});

$("add").onclick=$("fab").onclick=function(){openForm()};
$("q").oninput=render;
$("cList").onchange=updCount;
$("theme").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};
$("stats").onclick=$("leg").onclick=function(e){var b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;render();if(this.id==="leg")$("grid").scrollIntoView({behavior:"smooth",block:"start"})}};
$("grid").onclick=function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==="edit")openForm(id);else if(a==="check")openCheck(id);else if(a==="hist")openHist(id);
};

$("fForm").onsubmit=async function(e){
  if(e.submitter&&e.submitter.value!=="ok")return;
  e.preventDefault();
  var name=$("fName").value.trim(),loc=$("fLoc").value.trim(),who=$("fWho").value.trim(),time=$("fTime").value,desc=$("fDesc").value.trim();
  if(!name||!loc||!who)return;
  S.who=who;
  if(editId){
    var c=find(editId);
    c.name=name;c.loc=loc;c.petugas=who;c.time=time;c.desc=desc;
  }else{
    S.cams.push({id:uid(),name:name,loc:loc,petugas:who,time:time,desc:desc,history:[]});
  }
  var ok = await saveToCloud();
  if(ok){ $("dForm").close(); toast(editId?"Kamera diperbarui":"Kamera ditambahkan"); }
};

$("fDel").onclick=async function(){
  var c=find(editId);
  if(c&&confirm("Hapus "+c.name+" beserta seluruh riwayatnya?")){
    S.cams=S.cams.filter(function(x){return x.id!==editId});
    var ok = await saveToCloud();
    if(ok){ $("dForm").close(); toast("Kamera dihapus"); }
  }
};

$("fCheck").onsubmit=async function(e){
  if(e.submitter&&e.submitter.value!=="ok")return;
  e.preventDefault();
  var c=find(checkId),checks={};
  document.querySelectorAll("#cList input").forEach(function(i){checks[i.dataset.k]=i.checked});
  S.who=$("cWho").value.trim();
  if(!c.history) c.history=[];
  c.history.unshift({at:atTime($("cTime").value),who:S.who,checks:checks,note:$("cNote").value.trim()});
  if(c.history.length>100)c.history.length=100;
  var ok = await saveToCloud();
  if(ok){ $("dCheck").close(); toast("Pengecekan disimpan"); }
};
</script>
</body>
</html>
